name: flutter_html tests

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: flutter-actions/setup-flutter@54feb1e258158303e041b9eaf89314dcfbf6d38a
        with:
          version: 3.47.2
          channel: stable
          cache: true
          cache-sdk: true

      # The repo is a Dart pub workspace, so one resolution covers every
      # package, and it installs the pinned Melos from dev_dependencies.
      - name: Resolve workspace
        run: flutter pub get

      - name: Run Test Suite
        run: dart run melos run test

      - name: Compile Test Coverage Report
        run: dart run melos run gen_coverage

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage_report/lcov.info
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Run Dart Analysis
        run: dart run melos run analyze

      - name: Check that `dart format` has been run on every file
        run: dart run melos run format:check
