version: 3.0.0
homepage: https://github.com/Sub6Resources/flutter_html

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  html: '>=0.15.7 <1.0.0'
  flutter_html: ^3.0.0
  video_player: '>=2.14.0 <3.0.0'
  chewie_audio: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

funding:
  - https://github.com/sponsors/Sub6Resources

topics:
  - html
  - css
  - audio
  - layout
