name: flutter_html
description: A Flutter widget for rendering static HTML and CSS as Flutter widgets.
version: 3.0.0
homepage: https://github.com/Sub6Resources/flutter_html
repository: https://github.com/Sub6Resources/flutter_html

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

workspace:
  - example
  - packages/flutter_html_all
  - packages/flutter_html_audio
  - packages/flutter_html_iframe
  - packages/flutter_html_math
  - packages/flutter_html_svg
  - packages/flutter_html_table
  - packages/flutter_html_video

dependencies:
  # Plugin for parsing html
  html: '>=0.15.7 <1.0.0'

  # Plugin for parsing css
  csslib: ^1.0.2

  # Plugin for firstWhereOrNull extension on lists
  collection: ^1.19.1

  # plugin to manage lists and counting in a variety of styles
  list_counter: ^1.0.2

  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  meta: ^1.19.0
  melos: ^8.6.0

screenshots:
  - description: 'An example of the output produced by flutter_html'
    path: example/screenshots/flutter_html_screenshot.png
  - description: 'Continued example of the output produced by flutter_html'
    path: example/screenshots/flutter_html_screenshot1.png
  - description: 'Continued example of the output produced by flutter_html'
    path: example/screenshots/flutter_html_screenshot2.png
  - description: 'Continued example of the output produced by flutter_html'
    path: example/screenshots/flutter_html_screenshot3.png
  - description: 'Another example of the output produced by flutter_html'
    path: example/screenshots/flutter_html_readme_screenshot.png

funding:
  - https://github.com/sponsors/Sub6Resources

topics:
  - html
  - css
  - widgets
  - layout

melos:
  useRootAsPackage: true

  command:
    version:
      includeCommitId: true

  scripts:
    analyze:
      description: Run `flutter analyze` for every package in the workspace.
      exec:
        command: flutter analyze . --fatal-infos

    format:
      description: Format all Dart code in the workspace.
      run: dart format .

    format:check:
      description: Verify that all Dart code has been formatted.
      run: dart format -o none --set-exit-if-changed .

    test:
      description: Run all Flutter tests in this project.
      exec:
        command: flutter test --no-pub --coverage
        failFast: true
      packageFilters:
        flutter: true
        dirExists: test

    gen_coverage:
      description: Combine per-package coverage into a single lcov report.
      exec:
        command: "$MELOS_ROOT_PATH/combine_coverage.sh"
